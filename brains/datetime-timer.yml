---
  - name: "datetime-timer"
    signals:
      - order: "erinnere mich in {{timer_minutes}} minuten"
      - order: "mach eine erinnerung für in {{timer_minutes}} minuten"
    neurons:
      - neurotimer:
          minutes: "{{ numbers[timer_minutes] }}"
          synapse: "datetime-timer-finished"
          forwarded_parameters:
            timer_minutes: "{{timer_minutes}}"
      - say:
          message: "ich werde mich in {{timer_minutes}} minuten melden"

  - name: "datetime-timer-finished"
    signals: []
    neurons:
      - say:
          message: "erinnerung: die {{timer_minutes}} minuten sind abgelaufen"

